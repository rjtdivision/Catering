<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catering Units Management - Rajkot Div. (W.R.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#061a33;
    --navy-900:#0b2545;
    --navy-800:#123a6b;
    --navy-700:#1a4a86;
    --cyan-500:#06b6d4;
    --cyan-400:#22d3ee;
    --cyan-300:#67e8f9;
    --cyan-100:#e3fbff;
    --ink:#0b2545;
    --paper:#f4fbff;
    --line:rgba(255,255,255,0.14);
    --font-display:'Poppins',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:var(--font-body);
    background:var(--navy-950);
    overscroll-behavior:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    width:100%;
    max-width:560px;
    margin:0 auto;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.35);
  }

  /* ---- Header ---- */
  header{
    flex:0 0 auto;
    background:linear-gradient(135deg,var(--navy-950) 0%,var(--navy-800) 60%,var(--navy-700) 100%);
    color:#fff;
    padding:8px 14px;
    position:relative;
    overflow:hidden;
    border-bottom:2px solid var(--cyan-400);
  }
  header::after{
    content:"";
    position:absolute;
    top:-40px;right:-40px;
    width:140px;height:140px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,0.25),transparent 70%);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .brand-mark{
    flex:0 0 auto;
    width:32px;height:32px;
    border-radius:9px;
    background:linear-gradient(160deg,var(--cyan-400),var(--cyan-500));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(6,182,212,0.45);
  }
  .brand-text{
    min-width:0;
    overflow:hidden;
  }
  .brand-text h1{
    font-family:var(--font-display);
    font-size:13px;
    line-height:1.3;
    margin:0;
    font-weight:600;
    letter-spacing:0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-sub{
    font-size:10px;
    color:var(--cyan-300);
    letter-spacing:0.4px;
    text-transform:uppercase;
    font-weight:500;
    font-family:var(--font-body);
  }

  /* ---- Content / iframe ---- */
  main{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    background:#fff;
  }
  #contentFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
  }
  .placeholder{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
    color:var(--navy-800);
  }
  .placeholder svg{width:56px;height:56px;color:var(--cyan-500);margin-bottom:14px;}
  .placeholder h2{font-family:var(--font-display);font-size:16px;margin:0 0 6px;}
  .placeholder p{font-size:13px;color:#5a7291;margin:0;max-width:260px;}

  /* ---- Bottom tab nav ---- */
  nav{
    flex:0 0 auto;
    display:flex;
    background:var(--navy-950);
    border-top:1px solid var(--line);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(0,0,0,0.25);
  }
  .tab{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:6px 2px;
    background:none;
    border:none;
    color:#7b93b5;
    font-family:var(--font-body);
    font-size:9.5px;
    font-weight:500;
    letter-spacing:0.1px;
    cursor:pointer;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    transition:color .15s ease;
  }
  .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;transition:transform .15s ease;}
  .tab.active{color:var(--cyan-300);}
  .tab.active svg{transform:translateY(-1px);}
  .tab.active::before{
    content:"";
    position:absolute;
    top:-6px;left:50%;
    transform:translateX(-50%);
    width:22px;height:3px;
    border-radius:0 0 3px 3px;
    background:var(--cyan-400);
  }
  .tab span{text-align:center;line-height:1.15;}

  @media (min-width:561px){
    body{background:var(--navy-950);}
  }
</style>
</head>
<body>

<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b2545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8"/>
          <path d="M2 17h20"/>
          <circle cx="7" cy="19.5" r="1.5"/>
          <circle cx="17" cy="19.5" r="1.5"/>
          <path d="M6 7V4h6l3 3"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>CATERING UNITS MANAGEMENT <span class="brand-sub">- RAJKOT DIV. (W.R.)</span></h1>
      </div>
    </div>
  </header>

  <main>
    <iframe id="contentFrame" src="about:blank" title="Content area"></iframe>
  </main>

  <nav id="tabBar">
    <button class="tab" data-page="catering-unit.html" data-label="Catering Unit">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span>Catering Unit</span>
    </button>
    <button class="tab" data-page="vendor-details.html" data-label="Vendor Details">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-7 8-7s6.5 2.5 8 7"/></svg>
      <span>Vendor Details</span>
    </button>
    <button class="tab" data-page="outstanding-details.html" data-label="Outstanding Details">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Outstanding Details</span>
    </button>
    <button class="tab" data-page="vendor-list.html" data-label="Vendor List">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Vendor List</span>
    </button>
    <button class="tab" data-page="admin-panel.html" data-label="Admin Panel">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      <span>Admin Panel</span>
    </button>
  </nav>

</div>

<script>
  const frame = document.getElementById('contentFrame');
  const tabs = document.querySelectorAll('.tab');

  function loadTab(btn){
    tabs.forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    frame.src = btn.dataset.page;
  }

  tabs.forEach(btn => btn.addEventListener('click', () => loadTab(btn)));

  // Default view on page load: Vendor Details
  loadTab(tabs[1]);
</script>

</body>
</html>
